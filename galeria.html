<!-- Estilos para el modal -->
<style>
    .galeria-img {
        width: 360px !important;
        height: 240px !important;
        cursor: pointer;
        transition: transform 0.2s;
    }
    .galeria-img:hover {
        transform: scale(1.05);
    }
    .modal-galeria {
        display: none;
        position: fixed;
        z-index: 9999;
        left: 0; top: 0;
        width: 100vw; height: 100vh;
        background: rgba(0,0,0,0.8);
        justify-content: center;
        align-items: center;
    }
    .modal-galeria img {
        max-width: 90vw;
        max-height: 80vh;
        border-radius: 10px;
        box-shadow: 0 2px 16px rgba(0,0,0,0.3);
    }
    .modal-galeria .cerrar-modal {
        position: absolute;
        top: 30px;
        right: 40px;
        font-size: 2.5em;
        color: #fff;
        cursor: pointer;
        font-weight: bold;
        z-index: 10001;
        background: none;
        border: none;
    }
</style>
<!-- Modal HTML -->
<div class="modal-galeria" id="modalGaleria">
    <button class="cerrar-modal" id="cerrarModalGaleria">&times;</button>
    <img src="" alt="Imagen ampliada" id="imgModalGaleria">
</div>
<script>
    // Aplica la clase a todas las imágenes de la galería
    document.querySelectorAll('img[src^="img/foto"]').forEach(function(img) {
        img.classList.add('galeria-img');
        img.addEventListener('click', function() {
            document.getElementById('imgModalGaleria').src = this.src;
            document.getElementById('modalGaleria').style.display = 'flex';
        });
    });
    // Cerrar modal al hacer clic en la X o fuera de la imagen
    document.getElementById('cerrarModalGaleria').onclick = function() {
        document.getElementById('modalGaleria').style.display = 'none';
    };
    document.getElementById('modalGaleria').onclick = function(e) {
        if (e.target === this) {
            this.style.display = 'none';
        }
    };
</script>
