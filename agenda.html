<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clínico - Agendar Traslado</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background: #fff;
    }

    header {
      background: #f7f7f7;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 24px;
      color: #1da9cc;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 10px;
    }

    nav a {
      margin: 0 10px;
      text-decoration: none;
      color: #333;
      padding: 5px 10px;
      transition: background 0.3s;
    }

    nav a:hover {
      background-color: #1da9cc;
      color: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(29, 169, 204, 0.25);
      font-weight: bold;
      letter-spacing: 1px;
      padding: 8px 16px;
      transition: background 0.3s, color 0.3s, box-shadow 0.3s;
    }

    /* Botón hamburguesa */
    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 4px;
    }

    .hamburger div {
      width: 25px;
      height: 3px;
      background-color: #1da9cc;
      border-radius: 2px;
    }

    /* Responsive */
    @media screen and (max-width: 768px) {
      nav {
        display: none;
        flex-direction: column;
        width: 100%;
        margin-top: 10px;
      }

      nav.show {
        display: flex;
      }

      .hamburger {
        display: flex;
      }
    }

    .hero {
      background: url('tu-imagen.jpg') no-repeat center center/cover;
      color: white;
      padding: 100px 20px;
      text-align: center;
      position: relative;
    }

    .hero-overlay {
      background-color: rgba(0, 123, 255, 0.7);
      padding: 50px;
      color: white;
    }

    .hero-overlay h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 3em;
      font-weight: 700;
      margin: 0 0 10px;
    }

    .hero-overlay p {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.5em;
      margin: 0;
    }

    .info-section {
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .info-box {
      background: #f2f2f2;
      padding: 20px;
      border-left: 5px solid #1da9cc;
      max-width: 600px;
      width: 100%;
      box-sizing: border-box;
    }

    label {
      color: black;
      font-weight: 600;
    }

    input[type="date"],
    input[type="time"],
    input[type="text"],
    textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1em;
      font-family: inherit;
    }

    button {
      background-color: #1da9cc;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #0d6efd;
    }

    .info-box p {
      color: black;
      margin-top: 10px;
    }

    .info-box a {
      color: #1da9cc;
      text-decoration: none;
    }

    .info-box a:hover {
      text-decoration: underline;
    }

    @media screen and (max-width: 768px) {
      .hero-overlay h1 {
        font-size: 2em;
      }

      .hero-overlay p {
        font-size: 1.2em;
      }

      .info-box {
        padding: 15px;
        border-left-width: 3px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Servicios Médicos de Traslados</div>

    <!-- Botón hamburguesa -->
    <div class="hamburger" id="hamburger">
      <div></div>
      <div></div>
      <div></div>
    </div>

    <nav id="navMenu">
      <a href="index.html">Inicio</a>
      <a href="servicios.html">Servicios</a>
      <a href="ambulancia.html">Ambulancia</a>
      <a href="consultas.html">Contacto</a>
      <a href="agenda.html">Agenda</a>
      <a href="galeria.html">Galería</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-overlay">
      <h1>¿Necesitas agendar un traslado?</h1>
      <p>Danos tu información aquí abajo</p>
    </div>
  </section>

  <section class="info-section">
    <div class="info-box">
      <form action="mailto:josegonzagrijalva6664@gmail.com" method="post" enctype="text/plain">
        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" name="fecha" required>

        <label for="hora">Hora:</label>
        <input type="time" id="hora" name="hora" required>

        <label for="condicion">Condición del paciente:</label>
        <textarea id="condicion" name="condicion" rows="4" required></textarea>

        <label for="contacto">Número telefónico o correo electrónico:</label>
        <input type="text" id="contacto" name="contacto" required>

        <button type="submit">Enviar</button>

        <p>Si lo prefieres, puedes contactarnos por alguno de los medios que se muestran en <a href="consultas.php">Contacto</a>.</p>
      </form>
    </div>
  </section>

  <script>
    const hamburger = document.getElementById('hamburger');
    const navMenu = document.getElementById('navMenu');

    hamburger.addEventListener('click', () => {
      navMenu.classList.toggle('show');
    });
  </script>
</body>
</html>
